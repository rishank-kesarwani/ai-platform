version: '3.8'

services:
  ai-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_platform_app
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=development
      - PORT=4000
      - API_PREFIX=api/v1
      - LOG_LEVEL=info
      - AI_SERVICE_API_KEY=${AI_SERVICE_API_KEY:-test-service-api-key-12345}
      - MONGODB_URI=mongodb://root:rootpassword@mongodb:27017/ai_platform?authSource=admin
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=ai_platform_documents
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-text-embedding-004}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-768}
      - RAG_CHUNK_SIZE=800
      - RAG_CHUNK_OVERLAP=150
      - RAG_TOP_K=5
      - RAG_MIN_SCORE=0.5
      - AI_CACHE_ENABLED=true
      - AI_CACHE_TTL_SECONDS=300
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - ai_platform_network

  mongodb:
    image: mongo:7.0
    container_name: ai_platform_mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=rootpassword
      - MONGO_INITDB_DATABASE=ai_platform
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ai_platform_network

  redis:
    image: redis:7.2-alpine
    container_name: ai_platform_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ai_platform_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai_platform_qdrant
    restart: unless-stopped
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333' --"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ai_platform_network

volumes:
  mongo_data:
  redis_data:
  qdrant_data:

networks:
  ai_platform_network:
    driver: bridge
